  events:
    left_hand: 1
    right_hand: 2
  feedback_type: none
  instructions: Subjects were asked to imagine kinesthetic finger movements (touching index, middle, ring, and little finger
    to thumb within 3 seconds)
  mode: offline
  n_classes: 2
  paradigm: imagery
  primary_modality: visual
  stimulus_modalities:
  - visual
  stimulus_type: visual instruction
  study_design: motor imagery
  trial_duration: 3.0
file_format: .mat (MATLAB)
methodology: 'Subjects performed motor imagery of left and right hand finger movements (kinesthetic imagery). Each trial consisted
  of: 2 seconds fixation cross, 3 seconds instruction (left/right hand), followed by random 4.1-4.8 second break. Five or
  six runs performed with feedback after each run. Additional data collected: 6 types of non-task-related data (eye blinking,
  eyeball movements, head movement, jaw clenching, resting state) and 20 trials of real hand movement per class. 3D electrode
  coordinates measured with Polhemus Fastrak digitizer. Experiments conducted August-September 2011 in four time slots (9:30-12:00,
  12:30-15:00, 15:30-18:00, 19:00-21:30) with background noise 37-39 dB.'
