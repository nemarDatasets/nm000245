abstract: Motor imagery (MI)-based brain-computer interface (BCI) dataset from 52 subjects with EEG, EMG, psychological and
  physiological questionnaire, 3D EEG electrode locations, and non-task-related states. The dataset includes 100 or 120 trials
  per class (left/right hand) with validation showing 73.08% (38 subjects) had discriminative information. Mean accuracy of
  67.46% (±13.17%) over 50 subjects (excluding 2 bad subjects). Dataset stored in GigaDB and validated using bad trial percentage,
  ERD/ERS analysis, and classification analysis.
